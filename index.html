<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nidhi, Will You Be My Valentine?</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(to bottom right, #ff9ec4, #ffc3e0);
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
}

h1 {
    margin-top: 60px;
    font-size: 28px;
    color: white;
}

button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    position: absolute;
    transition: 0.15s;
}

#yesBtn {
    background-color: #ff2e63;
    color: white;
    left: 35%;
    top: 55%;
}

#noBtn {
    background-color: black;
    color: white;
    left: 55%;
    top: 55%;
}

#catContainer {
    display: none;
    position: absolute;
    top: 20%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
}

#catContainer img {
    width: 260px;
    max-width: 90%;
    border-radius: 15px;
}

#warningText {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 8px 15px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 18px;
}

/* Floating hearts */
.heart {
    position: absolute;
    bottom: -10px;
    font-size: 20px;
    animation: floatUp 6s linear infinite;
    color: white;
}

@keyframes floatUp {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-800px); opacity: 0; }
}
</style>
</head>

<body>

<h1>Nidhi, Will You Be My Valentine? ❤️</h1>

<button id="yesBtn">Yes</button>
<button id="noBtn">No</button>

<div id="catContainer">
    <img src="Screenshot_20260208-234101.png">
    <div id="warningText">Don't mess with me 😼</div>
</div>

<!-- Music -->
<iframe width="0" height="0"
src="https://www.youtube.com/embed/1vLzB6aRz9Q?start=85&autoplay=1&loop=1&playlist=1vLzB6aRz9Q"
allow="autoplay">
</iframe>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const catContainer = document.getElementById("catContainer");

let speedMultiplier = 1;

function moveButton() {
    const maxX = window.innerWidth - 100;
    const maxY = window.innerHeight - 60;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

    catContainer.style.display = "block";

    speedMultiplier += 0.3;
    noBtn.style.transition = 0.15 / speedMultiplier + "s";
}

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("touchstart", function(e){
    e.preventDefault();
    moveButton();
});

yesBtn.addEventListener("click", function(){
    document.body.innerHTML = `
        <h1 style="margin-top:100px; color:white;">
        Good Girl Nidhi ❤️<br><br>
        You are mine now 😌
        </h1>
    `;
});

function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.fontSize = (15 + Math.random() * 20) + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(createHeart, 400);
</script>

</body>
</html>
